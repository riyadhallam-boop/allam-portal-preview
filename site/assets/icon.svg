<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#244a38"/>
      <stop offset="100%" stop-color="#14261d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedb3"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7a1f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background Disc -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#c29b38" stroke-width="8"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="rgba(212, 175, 55, 0.25)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Tree Trunk & Roots -->
  <path d="M 236 410 C 236 340, 246 290, 256 250 C 266 290, 276 340, 276 410 C 306 426, 336 438, 370 440 C 326 430, 290 416, 272 400 C 264 420, 256 438, 256 450 C 256 438, 248 420, 240 400 C 222 416, 186 430, 142 440 C 176 438, 206 426, 236 410 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- 8 Primary Boughs & Leaves (8 Branches) -->
  <!-- Top Center -->
  <circle cx="256" cy="130" r="38" fill="#498762" stroke="#d4af37" stroke-width="4"/>
  <circle cx="256" cy="130" r="14" fill="url(#goldGrad)"/>

  <!-- Branch 1 & 2 (Top Left/Right) -->
  <circle cx="180" cy="170" r="32" fill="#3a7051" stroke="#d4af37" stroke-width="3"/>
  <circle cx="332" cy="170" r="32" fill="#3a7051" stroke="#d4af37" stroke-width="3"/>
  
  <!-- Branch 3 & 4 (Mid Left/Right) -->
  <circle cx="130" cy="235" r="30" fill="#2f5c42" stroke="#d4af37" stroke-width="3"/>
  <circle cx="382" cy="235" r="30" fill="#2f5c42" stroke="#d4af37" stroke-width="3"/>

  <!-- Branch 5 & 6 (Lower Left/Right) -->
  <circle cx="160" cy="305" r="28" fill="#274f38" stroke="#d4af37" stroke-width="3"/>
  <circle cx="352" cy="305" r="28" fill="#274f38" stroke="#d4af37" stroke-width="3"/>

  <!-- Branch 7 & 8 (Inner Accents) -->
  <circle cx="215" cy="230" r="24" fill="#3a7051" stroke="#d4af37" stroke-width="2"/>
  <circle cx="297" cy="230" r="24" fill="#3a7051" stroke="#d4af37" stroke-width="2"/>

  <!-- Connecting Branches Lines -->
  <path d="M 256 250 Q 220 200 180 170" stroke="url(#goldGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 256 250 Q 292 200 332 170" stroke="url(#goldGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 256 250 L 256 168" stroke="url(#goldGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M 256 270 Q 190 250 130 235" stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 256 270 Q 322 250 382 235" stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 256 290 Q 200 300 160 305" stroke="url(#goldGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 256 290 Q 312 300 352 305" stroke="url(#goldGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Arabic Typography Seal -->
  <text x="256" y="485" text-anchor="middle" font-family="'IBM Plex Sans Arabic', 'Amiri', 'Traditional Arabic', sans-serif" font-size="22" font-weight="bold" fill="#fcedb3" letter-spacing="1">دار آل علام ✦ ١٤٤٨</text>
</svg>
