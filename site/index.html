<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=portal/index.html">
    <title>بوابة آل علام — جاري الانتقال...</title>
    <style>
        body {
            background-color: #030816;
            color: #fde047;
            font-family: 'Segoe UI', Tahoma, 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loading-box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 32px 48px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: #fde047;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        a {
            color: #fde047;
            text-decoration: underline;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="loading-box">
        <div class="spinner"></div>
        <h2 style="margin: 0 0 10px 0; font-size: 20px;">بوابة عائلة آل علام</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 16px;">جاري الانتقال إلى البوابة الرسمية...</p>
        <a href="portal/index.html">اضغط هنا إذا لم يتم نقلك تلقائياً</a>
    </div>
    <script>
        window.location.replace("portal/index.html");
    </script>
</body>
</html>
